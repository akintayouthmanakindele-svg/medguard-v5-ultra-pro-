  <path d="M256 340 C240 360 235 385 245 410" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>
  <path d="M256 340 C272 360 277 385 267 410" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>

  <!-- Medical cross overlay subtle -->
